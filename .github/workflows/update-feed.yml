name: Update blog RSS feed

# Keeps feed.xml in sync with every page whose <head> carries a
# BlogPosting JSON-LD block (see scripts/update_feed.py). Runs on every
# push to main that touches an .html file, so a new blog post lands in
# the feed the same moment it's merged, with no separate step to remember.
# The nightly schedule is a safety net in case a push-triggered run ever
# gets skipped (e.g. a merge via the GitHub UI that doesn't fire push
# events the same way, or a transient Actions outage).
on:
  push:
    branches: [main]
    paths: ['*.html']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate feed.xml
        run: python3 scripts/update_feed.py

      - name: Commit and push if feed.xml changed
        run: |
          if git diff --quiet -- feed.xml; then
            echo "feed.xml already up to date, nothing to commit"
            exit 0
          fi
          git config user.name "vidyback-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.xml
          git commit -m "Auto-update feed.xml [skip ci]"
          git push
